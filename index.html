<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fde3bb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="合成大奶娃">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>合成大奶娃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #5b3a12;
    --label: #b0702a;
    --accent: #ff8a00;
    --num: "Fredoka", "Noto Sans TC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    /* 牆面：暖色直條紋 */
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 26px, transparent 26px 52px),
      linear-gradient(180deg, #fde8c4, #f6c98a);
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; overscroll-behavior: none;
  }
  img { -webkit-user-drag: none; }

  /* 桌面：高度由 JS 對齊到盒子底部 */
  .table {
    position: fixed; left: 0; right: 0; bottom: 0; top: var(--table-y, 80%);
    background:
      linear-gradient(180deg, #f0b878 0 10px, #c98a4e 10px 13px, transparent 13px),
      repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 3px, transparent 3px 14px),
      linear-gradient(180deg, #d99a5c, #a8662f);
    box-shadow: 0 -2px 0 rgba(255,255,255,.5);
  }

  .layout {
    position: relative; height: 100%; height: 100dvh; max-width: 520px; margin: 0 auto;
    display: grid; gap: 10px;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "score next" "stage stage" "evo evo";
    padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
  }

  .panel {
    position: relative;
    background: rgba(255, 252, 244, .78);
    border: 3px solid #fff; border-radius: 22px;
    box-shadow: 0 5px 0 rgba(200, 130, 60, .35), 0 12px 24px -12px rgba(140, 80, 20, .35);
    padding: 8px 14px;
  }
  .panel h3 { margin: 0; font-size: 13px; font-weight: 900; color: var(--label); letter-spacing: 1px; }

  .score { grid-area: score; }
  #score {
    display: inline-block; transform-origin: left center;
    font: 700 36px/1.05 var(--num); color: var(--accent); font-variant-numeric: tabular-nums;
  }
  #score.bump { animation: bump .3s ease; }
  @keyframes bump { 40% { transform: scale(1.15); } }
  .best { font: 600 12px var(--num); color: var(--label); }

  .next { grid-area: next; display: flex; flex-direction: column; align-items: flex-start; }
  .next h3 { white-space: nowrap; }
  .next .bubble {
    width: 54px; height: 54px; border-radius: 50%; flex: none; margin-top: 2px;
    background: radial-gradient(circle at 35% 30%, #fff, #ffeccc);
    box-shadow: inset 0 -3px 0 rgba(220, 160, 90, .3);
    display: grid; place-items: center;
  }
  .next img { width: 38px; height: 38px; object-fit: contain; }
  .icon-btn {
    position: absolute; top: 8px; right: 8px;
    width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer;
    background: #ffeccc; color: var(--ink); display: grid; place-items: center;
  }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn svg { width: 18px; height: 18px; }

  #stage { grid-area: stage; min-height: 0; align-self: stretch; display: grid; place-items: end center; }
  canvas { display: block; cursor: pointer; }

  .evo { grid-area: evo; padding: 6px 10px; }
  .evo h3 { display: none; }
  .evo .list { display: flex; justify-content: space-between; }
  .evo .step { display: flex; flex-direction: column; align-items: center; flex: 1; }
  .evo img { width: 28px; height: 28px; object-fit: contain; transition: filter .3s, opacity .3s, transform .3s; }
  .evo span { white-space: nowrap; }
  .evo span { font-size: 10px; font-weight: 700; color: var(--label); }
  .evo .locked img { filter: grayscale(1) brightness(1.2); opacity: .35; }
  .evo .locked span { opacity: .4; }
  .evo .top img { transform: scale(1.15); }

  /* 寬螢幕：分數在左，下一個/圖鑑在右 */
  @media (min-aspect-ratio: 1/1) and (min-width: 760px) {
    .layout {
      max-width: 1100px; gap: 28px; padding: 28px;
      grid-template-columns: 1fr minmax(0, 1.5fr) 1fr;
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "score stage next" "evo stage .";
      align-items: start;
    }
    .panel { padding: 14px 18px; }
    #score { font-size: 54px; }
    .next .bubble { width: 96px; height: 96px; align-self: center; }
    .next img { width: 68px; height: 68px; }
    .evo { padding: 14px 18px; }
    .evo h3 { display: block; margin-bottom: 8px; }
    .evo .list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 4px; }
    .evo img { width: 42px; height: 42px; }
    .evo span { font-size: 11px; }
  }

  /* 橫向手機：寬版排列，但把留白縮到最小 */
  @media (min-aspect-ratio: 1/1) and (min-width: 760px) and (max-height: 520px) {
    .layout { padding: 6px 16px; gap: 6px 20px; }
    .panel { padding: 8px 12px; }
    #score { font-size: 36px; }
    .next .bubble { width: 60px; height: 60px; }
    .next img { width: 42px; height: 42px; }
    .evo { padding: 8px 12px; }
    .evo h3 { display: none; }
    .evo img { width: 30px; height: 30px; }
  }

  /* 矮螢幕（多數手機瀏覽器）：面板和圖鑑都保留，只是縮成一行，把高度讓給盒子 */
  @media (max-aspect-ratio: 1/1) and (min-aspect-ratio: 1/2.05),
         (min-aspect-ratio: 1/1) and (max-width: 759px) {
    .layout {
      gap: 6px;
      padding: max(6px, env(safe-area-inset-top)) 10px max(6px, env(safe-area-inset-bottom));
    }
    .panel { border-width: 2px; border-radius: 16px; padding: 4px 10px; box-shadow: 0 3px 0 rgba(200, 130, 60, .35); }
    .score, .next { display: flex; flex-direction: row; align-items: center; gap: 8px; min-height: 48px; }
    .score h3, .next h3 { font-size: 12px; }
    #score { font-size: 26px; }
    .best { font-size: 11px; white-space: nowrap; margin-left: auto; }
    .next .bubble { width: 38px; height: 38px; margin: 0; }
    .next img { width: 28px; height: 28px; }
    .icon-btn { position: static; margin-left: auto; width: 32px; height: 32px; }
    .evo { padding: 3px 6px; }
    .evo img { width: 24px; height: 24px; }
    .evo span { font-size: 9px; }
  }

  /* 結束畫面 */
  .modal {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; z-index: 5;
    background: rgba(60, 35, 5, .35);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal .card {
    width: min(300px, 100%); background: #fff8e6; border-radius: 26px; padding: 24px;
    text-align: center; border: 4px solid #fff; box-shadow: 0 8px 0 #e3a35a;
    transform: scale(.9); transition: transform .3s cubic-bezier(.2,1.4,.4,1);
  }
  .modal.show .card { transform: none; }
  .modal img { width: 90px; height: 120px; object-fit: contain; }
  .modal h2 { margin: 6px 0 0; font-size: 22px; font-weight: 900; }
  .modal .final { font: 700 52px/1.1 var(--num); color: var(--accent); margin: 4px 0; }
  .modal .sub { color: var(--label); font-size: 13px; margin-bottom: 18px; }
  .btn {
    width: 100%; border: 0; border-radius: 999px; padding: 14px; cursor: pointer;
    font: 900 17px "Noto Sans TC", system-ui, sans-serif; color: #fff;
    background: var(--accent); box-shadow: 0 5px 0 #c86a00;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c86a00; }
</style>
</head>
<body>
<div class="table"></div>

<div class="layout">
  <section class="panel score">
    <h3>分數</h3>
    <b id="score">0</b>
    <div class="best">最高 <span id="best">0</span></div>
  </section>

  <section class="panel next">
    <h3>下一個</h3>
    <div class="bubble"><img id="nextImg" alt=""></div>
    <button class="icon-btn" id="restartBtn" aria-label="重新開始" title="重新開始">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </section>

  <main id="stage"><canvas id="c"></canvas></main>

  <section class="panel evo">
    <h3>奶家人圖鑑</h3>
    <div class="list" id="evo"></div>
  </section>
</div>

<div class="modal" id="over"><div class="card">
  <img src="assets/wa.png" alt="">
  <h2>遊戲結束</h2>
  <div class="final" id="finalScore">0</div>
  <div class="sub" id="finalSub">最高分 0</div>
  <button class="btn" id="restart">再玩一次</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="shapes.js"></script>
<script>
const { Engine, Bodies, Body, Composite, Events, Vertices } = Matter;

// ---- 角色等級：由小到大；size 為等效直徑（世界座標） ----
const LEVELS = [
  { name: '奶豆', file: 'dou', size: 54 },
  { name: '奶蛋', file: 'dan', size: 72 },
  { name: '奶鼠', file: 'shu', size: 92 },
  { name: '奶貓', file: 'mao', size: 114 },
  { name: '奶雞', file: 'ji',  size: 138 },
  { name: '奶茶', file: 'cha', size: 164 },
  { name: '奶狗', file: 'gou', size: 192 },
  { name: '奶粉', file: 'fen', size: 222 },
  { name: '奶娃', file: 'wa',  size: 256 },
];
const MAX_DROP_LEVEL = 3;
const MERGE_SCORE = [0, 2, 6, 12, 20, 30, 42, 56, 72];
const WAWA_BONUS = 300;
const PARTICLE_COLORS = ['#ffe25c', '#ffc93c', '#ffb39a', '#ffe08a', '#ff9b5c', '#a3c96b', '#e8b46a', '#ff9fb8', '#ffbf2e'];

// 世界座標：盒子內部 x 0..W、y BOX_TOP..H；畫布左右各多留 PAD 畫玻璃壁
const W = 400, H = 760;
const BOX_TOP = 160, DROP_Y = 88, DANGER_Y = BOX_TOP;
const PAD = 22, CW = W + PAD * 2, CH = H + 24;
const STEP_MS = 1000 / 120;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

// ---- 每個等級的形狀：把凸包縮放到指定大小，並記下重心位置 ----
for (const L of LEVELS) {
  const S = SHAPES[L.file];
  const pts = S.hull.map(([x, y]) => ({ x, y }));
  const area = Math.abs(Vertices.area(pts, true));
  L.scale = L.size / (2 * Math.sqrt(area / Math.PI));
  L.verts = pts.map(p => ({ x: p.x * L.scale, y: p.y * L.scale }));
  L.centre = Vertices.centre(L.verts);
  L.w = S.w * L.scale; L.h = S.h * L.scale;
  const xs = L.verts.map(p => p.x - L.centre.x);
  L.minX = Math.min(...xs); L.maxX = Math.max(...xs);
  L.img = new Image(); L.img.src = `assets/${L.file}.png`;
}

$('evo').innerHTML = LEVELS.map(l =>
  `<div class="step"><img src="assets/${l.file}.png" alt="${l.name}"><span>${l.name}</span></div>`).join('');
const evoSteps = [...document.querySelectorAll('.evo .step')];

// ---- 畫面縮放 ----
let scale = 1, dpr = 1;
function resize() {
  const st = $('stage').getBoundingClientRect();
  scale = Math.min(st.width / CW, st.height / CH);
  dpr = Math.min(2, window.devicePixelRatio || 1);   // 手機上限 2 倍，省電也比較順
  canvas.style.width = CW * scale + 'px';
  canvas.style.height = CH * scale + 'px';
  canvas.width = Math.round(CW * scale * dpr);
  canvas.height = Math.round(CH * scale * dpr);
  // 讓桌面上緣對齊盒子底部
  const r = canvas.getBoundingClientRect();
  document.body.style.setProperty('--table-y', r.top + (H + 4) * scale + 'px');
}
addEventListener('resize', resize);

// ---- 音效 ----
let audio;
function beep(level, big) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime;
    const notes = big ? [523, 659, 784, 1047] : [330 * Math.pow(1.122, level)];
    notes.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f, t + i * 0.09);
      o.frequency.exponentialRampToValueAtTime(f * 1.5, t + i * 0.09 + 0.12);
      g.gain.setValueAtTime(0.0001, t + i * 0.09);
      g.gain.exponentialRampToValueAtTime(0.22, t + i * 0.09 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.22);
      o.connect(g).connect(audio.destination);
      o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.25);
    });
  } catch (e) {}
}

// ---- 物理世界 ----
const engine = Engine.create({ positionIterations: 10, velocityIterations: 8 });
engine.gravity.y = 1.2;
const wallOpts = { isStatic: true, friction: 0.05, restitution: 0.2 };
Composite.add(engine.world, [
  Bodies.rectangle(W / 2, H + 50, W * 2, 100, wallOpts),
  Bodies.rectangle(-50, H / 2 - 400, 100, H * 3, wallOpts),
  Bodies.rectangle(W + 50, H / 2 - 400, 100, H * 3, wallOpts),
]);

function makeBody(level, x, y, startScale = 1) {
  const L = LEVELS[level];
  const b = Bodies.fromVertices(x, y, [L.verts], {
    restitution: 0.2, friction: 0.02, frictionStatic: 0.05, frictionAir: 0.004,
    density: 0.0012, slop: 0.03,
  });
  b.plugin = { level, born: time, merged: false, s: 1 };
  if (startScale !== 1) { Body.scale(b, startScale, startScale); b.plugin.s = startScale; }
  Composite.add(engine.world, b);
  return b;
}

const allPieces = () => Composite.allBodies(engine.world).filter(b => b.plugin && b.plugin.level !== undefined);

// ---- 遊戲狀態 ----
let particles, texts, score, current, next, aimX, cooldown, dangerTime, over, time, banner, mergeQueue, topLevel, acc;
let best = 0;
try { best = +localStorage.getItem('naiwa-best') || 0; } catch (e) {}
$('best').textContent = best;

function randLevel() {
  const w = [5, 4, 3, 2].slice(0, MAX_DROP_LEVEL + 1);
  let n = Math.random() * w.reduce((a, b) => a + b);
  for (let i = 0; i < w.length; i++) if ((n -= w[i]) < 0) return i;
  return 0;
}

function reset() {
  for (const b of allPieces()) Composite.remove(engine.world, b);
  particles = []; texts = []; mergeQueue = [];
  score = 0; time = 0; dangerTime = 0; cooldown = 0; over = false; banner = null; acc = 0;
  topLevel = 0; aimX = W / 2;
  current = 0; next = randLevel();
  updateHud();
  $('over').classList.remove('show');
}

function updateHud(bump) {
  const el = $('score');
  el.textContent = score;
  if (bump) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  $('nextImg').src = `assets/${LEVELS[next].file}.png`;
  evoSteps.forEach((s, i) => { s.classList.toggle('locked', i > topLevel); s.classList.toggle('top', i === topLevel); });
  if (score > best) {
    best = score; $('best').textContent = best;
    try { localStorage.setItem('naiwa-best', best); } catch (e) {}
  }
}

function clampX(level, x) {
  const L = LEVELS[level];
  return Math.max(-L.minX + 2, Math.min(W - L.maxX - 2, x));
}

function drop() {
  if (over || cooldown > 0) return;
  makeBody(current, clampX(current, aimX), DROP_Y);
  current = next; next = randLevel();
  cooldown = 0.5;
  updateHud();
}

// ---- 合成 ----
function onCollide(e) {
  for (const { bodyA: a, bodyB: b } of e.pairs) {
    const pa = a.plugin, pb = b.plugin;
    if (!pa || !pb || pa.level === undefined || pb.level === undefined) continue;
    if (pa.level !== pb.level || pa.merged || pb.merged) continue;
    pa.merged = pb.merged = true;
    mergeQueue.push([a, b]);
  }
}
Events.on(engine, 'collisionStart', onCollide);
Events.on(engine, 'collisionActive', onCollide);

function processMerges() {
  for (const [a, b] of mergeQueue) {
    const lv = a.plugin.level;
    const x = (a.position.x + b.position.x) / 2, y = (a.position.y + b.position.y) / 2;
    Composite.remove(engine.world, a); Composite.remove(engine.world, b);
    if (lv === LEVELS.length - 1) {
      score += WAWA_BONUS;
      burst(x, y, PARTICLE_COLORS[lv], 70, 9);
      burst(x, y, '#ffffff', 30, 7);
      texts.push({ x, y, text: '+' + WAWA_BONUS, t: 0 });
      banner = { text: '奶娃大團圓！', t: 0 };
      beep(lv, true);
    } else {
      const nb = makeBody(lv + 1, x, y, 0.6);
      Body.setVelocity(nb, { x: (a.velocity.x + b.velocity.x) / 2, y: Math.min(0, (a.velocity.y + b.velocity.y) / 2) - 1.5 });
      Body.setAngle(nb, (a.angle + b.angle) / 2);
      score += MERGE_SCORE[lv + 1];
      topLevel = Math.max(topLevel, lv + 1);
      burst(x, y, PARTICLE_COLORS[lv + 1], 12 + lv * 5, 3 + lv * 0.8);
      texts.push({ x, y, text: '+' + MERGE_SCORE[lv + 1], t: 0 });
      if (lv + 1 === LEVELS.length - 1) { banner = { text: '合成大奶娃！', t: 0 }; beep(lv + 1, true); }
      else beep(lv + 1, false);
      if (navigator.vibrate) navigator.vibrate(lv + 1 >= 5 ? 30 : 12);
    }
    updateHud(true);
  }
  mergeQueue = [];
}

function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * 60 * (0.4 + Math.random() * 0.8);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4,
      t: 0, size: 2.5 + Math.random() * 4.5, color, star: Math.random() < 0.35 });
  }
}

// ---- 更新 ----
function step(dt) {
  acc += dt * 1000;
  while (acc >= STEP_MS) {
    // 新合成的角色從小長大
    for (const b of allPieces()) {
      const p = b.plugin;
      if (p.s < 1) { const ns = Math.min(1, p.s + STEP_MS / 1000 * 5); Body.scale(b, ns / p.s, ns / p.s); p.s = ns; }
    }
    Engine.update(engine, STEP_MS);
    processMerges();
    acc -= STEP_MS;
  }
}

function update(dt) {
  time += dt;
  if (!over) {
    cooldown = Math.max(0, cooldown - dt);
    step(dt);
    const danger = allPieces().some(b => time - b.plugin.born > 1.2 && b.bounds.min.y < DANGER_Y && b.speed < 2);
    dangerTime = danger ? dangerTime + dt : Math.max(0, dangerTime - dt * 2);
    if (dangerTime > 2.5) gameOver();
  } else {
    step(dt * 0.4);
  }
  for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; p.vx *= 0.97; }
  particles = particles.filter(p => p.t < p.life);
  for (const t of texts) t.t += dt;
  texts = texts.filter(t => t.t < 0.9);
  if (banner) { banner.t += dt; if (banner.t > 2) banner = null; }
}

function gameOver() {
  over = true;
  $('finalScore').textContent = score;
  $('finalSub').textContent = score >= best ? '新紀錄！' : `最高分 ${best}`;
  setTimeout(() => $('over').classList.add('show'), 600);
}

// ---- 繪製 ----
let debug = false;
function drawSprite(level, x, y, angle, s, alpha) {
  const L = LEVELS[level];
  if (!L.img.complete || !L.img.naturalWidth) return;
  ctx.save();
  ctx.globalAlpha = alpha ?? 1;
  ctx.translate(x, y); ctx.rotate(angle); ctx.scale(s, s);
  ctx.drawImage(L.img, -L.centre.x, -L.centre.y, L.w, L.h);
  ctx.restore();
}

// 玻璃盒外框的 U 形路徑（e = 往外偏移量）
function boxPath(e) {
  const r = 26;
  ctx.beginPath();
  ctx.moveTo(-e, BOX_TOP);
  ctx.lineTo(-e, H - r);
  ctx.quadraticCurveTo(-e, H + e, r, H + e);
  ctx.lineTo(W - r, H + e);
  ctx.quadraticCurveTo(W + e, H + e, W + e, H - r);
  ctx.lineTo(W + e, BOX_TOP);
}

function drawBoxBack() {
  // 桌上的影子
  ctx.fillStyle = 'rgba(110, 55, 10, .22)';
  ctx.beginPath(); ctx.ellipse(W / 2, H + 12, W / 2 + 18, 10, 0, 0, Math.PI * 2); ctx.fill();
  // 盒子內部：淡淡的冷色玻璃，跟暖色牆面拉開
  boxPath(0); ctx.closePath();
  const g = ctx.createLinearGradient(0, BOX_TOP, 0, H);
  g.addColorStop(0, 'rgba(235, 248, 255, .55)');
  g.addColorStop(1, 'rgba(210, 236, 250, .75)');
  ctx.fillStyle = g; ctx.fill();
}

function drawBoxFront() {
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  boxPath(7); ctx.lineWidth = 17; ctx.strokeStyle = 'rgba(150, 95, 40, .45)'; ctx.stroke();
  boxPath(7); ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(245, 252, 255, .92)'; ctx.stroke();
  boxPath(7); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(170, 215, 240, .9)'; ctx.stroke();
  // 玻璃反光
  ctx.fillStyle = 'rgba(255, 255, 255, .55)';
  ctx.beginPath(); ctx.roundRect(10, BOX_TOP + 24, 7, H - BOX_TOP - 120, 4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(22, BOX_TOP + 24, 3, H - BOX_TOP - 220, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(W - 16, H - 150, 5, 90, 3); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, PAD * scale * dpr, 0);
  ctx.clearRect(-PAD, 0, CW, CH);

  drawBoxBack();
  const pieces = allPieces();

  // 瞄準
  if (!over) {
    const L = LEVELS[current];
    const x = clampX(current, aimX);
    const g = ctx.createLinearGradient(0, DROP_Y, 0, H);
    g.addColorStop(0, 'rgba(255,138,0,.4)'); g.addColorStop(1, 'rgba(255,138,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 1, DROP_Y + L.h * 0.3, 2, H - DROP_Y);
    drawSprite(current, x, DROP_Y, 0, 1, cooldown > 0 ? 0.4 : 1);
  }

  // 角色（帶陰影）
  ctx.save();
  ctx.shadowColor = 'rgba(80, 60, 20, .2)';
  ctx.shadowBlur = 8 * scale * dpr;
  ctx.shadowOffsetY = 3 * scale * dpr;
  for (const b of pieces) drawSprite(b.plugin.level, b.position.x, b.position.y, b.angle, b.plugin.s);
  ctx.restore();

  if (debug) {
    ctx.strokeStyle = 'rgba(0,120,255,.8)'; ctx.lineWidth = 1;
    for (const b of pieces) {
      ctx.beginPath();
      b.vertices.forEach((v, i) => i ? ctx.lineTo(v.x, v.y) : ctx.moveTo(v.x, v.y));
      ctx.closePath(); ctx.stroke();
    }
  }

  drawBoxFront();

  // 警戒線（盒口）
  const near = pieces.some(b => time - b.plugin.born > 1.2 && b.bounds.min.y < DANGER_Y + 60);
  if (near || dangerTime > 0) {
    const pulse = dangerTime > 0 ? 0.55 + 0.45 * Math.sin(time * 16) : 0.4;
    ctx.save();
    ctx.strokeStyle = `rgba(239, 68, 68, ${pulse})`;
    ctx.lineWidth = 3; ctx.setLineDash([10, 8]); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(4, DANGER_Y); ctx.lineTo(W - 4, DANGER_Y); ctx.stroke();
    ctx.restore();
  }

  // 粒子
  for (const p of particles) {
    const k = 1 - p.t / p.life;
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    if (p.star) {
      const r = p.size * 1.4;
      ctx.moveTo(p.x, p.y - r); ctx.quadraticCurveTo(p.x, p.y, p.x + r, p.y);
      ctx.quadraticCurveTo(p.x, p.y, p.x, p.y + r); ctx.quadraticCurveTo(p.x, p.y, p.x - r, p.y);
      ctx.quadraticCurveTo(p.x, p.y, p.x, p.y - r);
    } else ctx.arc(p.x, p.y, p.size * (0.5 + k * 0.5), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 加分文字
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const k = t.t / 0.9;
    ctx.globalAlpha = 1 - k * k;
    ctx.font = '700 24px Fredoka, sans-serif';
    ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#ff8a00';
    ctx.strokeText(t.text, t.x, t.y - t.t * 70); ctx.fillText(t.text, t.x, t.y - t.t * 70);
  }
  ctx.globalAlpha = 1;

  if (banner) {
    const k = Math.min(1, banner.t * 4), fade = banner.t > 1.6 ? 1 - (banner.t - 1.6) / 0.4 : 1;
    const s = 0.5 + 0.5 * easeOutBack(k);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(W / 2, H * 0.45); ctx.scale(s, s);
    ctx.font = '900 40px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
    ctx.lineWidth = 12; ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff';
    const g = ctx.createLinearGradient(0, -20, 0, 20);
    g.addColorStop(0, '#ffb21e'); g.addColorStop(1, '#ff6a00');
    ctx.fillStyle = g;
    ctx.strokeText(banner.text, 0, 0); ctx.fillText(banner.text, 0, 0);
    ctx.restore();
  }
}

function easeOutBack(t) { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

// ---- 輸入 ----
function toWorldX(e) { const r = canvas.getBoundingClientRect(); return (e.clientX - r.left) / scale - PAD; }
canvas.addEventListener('pointermove', e => { aimX = toWorldX(e); });
canvas.addEventListener('pointerdown', e => {
  aimX = toWorldX(e);
  // iOS 需要在使用者觸控時才能啟用聲音
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  } catch (err) {}
});
canvas.addEventListener('pointerup', e => { aimX = toWorldX(e); drop(); });
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') aimX -= 20;
  if (e.key === 'ArrowRight') aimX += 20;
  if (e.key === ' ' || e.key === 'Enter') drop();
  if (e.key === 'd') debug = !debug;   // 顯示碰撞外框
  aimX = Math.max(0, Math.min(W, aimX));
});
$('restart').addEventListener('click', reset);
$('restartBtn').addEventListener('click', reset);

// ---- 主迴圈 ----
let last = performance.now();
function loop(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
reset();
resize();
requestAnimationFrame(loop);

// 切回 App 時不要一次補跑太多時間
document.addEventListener('visibilitychange', () => { last = performance.now(); });

// 離線快取，可「加到主畫面」當 App 玩
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
